# Reverse proxy local para docker-compose, replicando las reglas de dominio
# que Dokploy aplica en producción (ver README): /api y /uploads van al
# servicio `api`, todo lo demás va al servicio `web`. Mismo origen, sin CORS.
server {
  listen 3000;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
