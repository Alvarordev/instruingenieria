services:
  api:
    image: ghcr.io/alvarordev/instruingenieria-api:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=/data/db.sqlite
      - UPLOADS_DIR=/data/uploads
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - instru_data:/data

  web:
    image: ghcr.io/alvarordev/instruingenieria-web:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://api:4000
    depends_on:
      - api

  # Dokploy no está enrutando /api ni /uploads del dominio de `web` hacia
  # `api` (cada servicio quedó con su propio dominio autogenerado). En vez de
  # depender de reglas de dominio por path entre dos servicios, reusamos el
  # mismo proxy que ya funciona en local: la Domain de Dokploy debe apuntar
  # a este servicio (puerto 3000), no directo a `web`.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  instru_data:
